# Instruction templates for cleanup plan items. They are text only: diskdash shows
# them with copy buttons and never runs anything. Edit them freely.
#
# Placeholders: {path} the item, {dir} its folder, {name} its file or folder name,
# {destination} where the user wants to move it.

templates:
  explorer-delete:
    - "Open it in Explorer with the button on this row and check that it is what you expect."
    - "Select it and press Delete. Windows moves it to the Recycle Bin, so you can still undo it."
    - "Empty the Recycle Bin when you are sure (that is when the space comes back)."

  duplicate-remove:
    - "Open it in Explorer with the button on this row and compare it with the copy you keep."
    - "If it is an identical copy you do not need, select it and press Delete (it goes to the Recycle Bin)."
    - "Empty the Recycle Bin when you are sure."

  stale-review:
    - "Open it in Explorer and look through it: nothing here has been used for a long time, but only you know if it matters."
    - "If you no longer need it, delete it (it goes to the Recycle Bin). If you want to keep it, move it to a slower drive or an archive."

  manual-move-dir:
    - "Make sure nothing is using the folder (close the programs that read it)."
    - "Copy it to the other drive. Run this yourself in a terminal (diskdash never runs it):"
    - "robocopy \"{path}\" \"{destination}\" /E /COPY:DAT /DCOPY:T"
    - "Check the copy: open {destination} in Explorer and compare the number of files and the size."
    - "Only then delete the original folder in Explorer (it goes to the Recycle Bin)."
    - "If a program or game uses this folder, point it at the new place (a launcher's own move option is easier, see the notes above)."

  manual-move-file:
    - "Make sure nothing is using the file."
    - "Copy it to the other drive. Run this yourself in a terminal (diskdash never runs it):"
    - "robocopy \"{dir}\" \"{destination}\" \"{name}\" /COPY:DAT"
    - "Check the copy in Explorer, then delete the original (it goes to the Recycle Bin)."

  # Tiering: apps and games must be moved with their own tools, not by hand.
  tier-steam:
    - "This is a Steam game. Do not copy the folder yourself: Steam would lose track of it."
    - "First add a Steam library on the other drive: Steam > Settings > Storage > the drive list > Add Drive ({destination_drive})."
    - "Then in your Library right-click the game > Properties > Installed Files > Move install folder, and choose that library."
    - "Steam copies the game, updates its records and removes the old copy for you."

  tier-epic:
    - "This is an Epic Games game. Do not copy the folder yourself: the launcher would lose track of it."
    - "In the Epic Games Launcher, open your Library, click the three dots on the game and look for Move (newer launcher versions)."
    - "If there is no Move option, uninstall the game and install it again, choosing a folder on {destination_drive}."

  tier-app-install:
    - "This folder is the install location of a program that Windows knows about. Moving it by hand would break the program."
    - "Reinstall it to the other drive instead: open Settings > Apps > Installed apps (the button on the Installed apps page opens it), uninstall the program, then run its installer again and choose a folder on {destination_drive}."
    - "diskdash does not suggest links or junctions for this."
